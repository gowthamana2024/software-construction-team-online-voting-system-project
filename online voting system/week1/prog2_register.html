<!DOCTYPE html>
<html>
<head>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600&display=swap');
        body { margin: 0; padding: 40px; background: #2a2a40; min-height: 100vh; font-family: 'Outfit'; display: flex; align-items: center; justify-content: center; }
        .register-box { background: #1e1e2f; padding: 50px; border-radius: 20px; width: 500px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1); }
        h2 { color: #fff; margin-top: 0; font-size: 28px; border-left: 5px solid #00f2fe; padding-left: 15px;}
        .form-row { display: flex; gap: 20px; }
        .input-group { margin-bottom: 25px; flex: 1;}
        label { display: block; color: #888; margin-bottom: 8px; font-size: 14px;}
        input { width: 100%; padding: 15px; background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: #fff; font-family: 'Outfit'; box-sizing: border-box; outline: none; transition: 0.3s;}
        input:focus { border-color: #00f2fe; background: rgba(0,242,254,0.05);}
        input[readonly] { opacity: 0.7; cursor: not-allowed; }
        button { width: 100%; padding: 18px; background: #00f2fe; color: #1e1e2f; border: none; border-radius: 8px; font-size: 16px; font-weight: 800; cursor: pointer; text-transform: uppercase; transition: 0.3s; margin-top: 10px;}
        button:hover { background: #4facfe; transform: translateY(-2px); box-shadow: 0 10px 20px rgba(0,242,254,0.3);}
    </style>
</head>
<body>
    <div class="register-box">
        <h2>Voter Enrollment</h2>
        <form>
            <div class="input-group">
                <label>Full Legal Name</label>
                <input type="text" placeholder="Enter full name" required>
            </div>
            <div class="input-group">
                <label>Secure Email Address</label>
                <input type="email" placeholder="example@rec.ac.in" required>
            </div>
            <div class="form-row">
                <div class="input-group">
                    <label>Department</label>
                    <input type="text" value="AI & DS" readonly>
                </div>
                <div class="input-group">
                    <label>Institution</label>
                    <input type="text" value="REC College" readonly>
                </div>
            </div>
            <button type="submit">Initialize Biometrics</button>
        </form>
    </div>
</body>
</html>
