<!DOCTYPE html>
<html>
<head>
    <title>Programme 4: Voter Application</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&display=swap');
        body { 
            font-family: 'Inter', sans-serif; 
            margin: 0; padding: 40px;
            background: url('https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=1920') no-repeat center center fixed;
            background-size: cover;
            display: flex; justify-content: center; align-items: center; min-height: 100vh;
            color: #fff; box-sizing: border-box;
        }
        .form-container { 
            background: rgba(10, 15, 30, 0.85); 
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            padding: 50px; border-radius: 20px; width: 100%; max-width: 600px; 
            box-shadow: 0 30px 60px rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.1);
        }
        .form-header { text-align: center; margin-bottom: 40px; }
        .form-header h2 { margin: 0; font-size: 36px; background: -webkit-linear-gradient(#00f2fe, #4facfe); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .form-header p { color: #aaa; margin-top: 10px; font-size: 15px;}
        .form-group { margin-bottom: 25px; position: relative; }
        label { display: block; margin-bottom: 8px; font-weight: 500; color: #ddd; font-size: 14px; text-transform: uppercase; letter-spacing: 1px;}
        input[type="text"], input[type="email"], select, textarea { 
            width: 100%; padding: 15px; 
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); 
            border-radius: 10px; color: #fff; font-family: 'Inter'; box-sizing: border-box;
            transition: all 0.3s; font-size: 16px;
        }
        input:focus, select:focus, textarea:focus { border-color: #00f2fe; background: rgba(0,242,254,0.05); outline: none; box-shadow: 0 0 15px rgba(0,242,254,0.2);}
        select option { background: #0a0f1e; color: #fff; }
        .radio-group { display: flex; gap: 20px; padding: 10px 0;}
        .radio-label { display: flex; align-items: center; cursor: pointer; color: #fff; font-size: 16px;}
        .radio-label input { margin-right: 10px; cursor: pointer; accent-color: #00f2fe; width: 20px; height: 20px;}
        textarea { resize: vertical; min-height: 100px; }
        .buttons { display: flex; gap: 20px; margin-top: 40px; }
        button { flex: 1; padding: 18px; border: none; border-radius: 10px; font-size: 16px; font-weight: 700; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; transition: 0.3s; }
        .btn-submit { background: linear-gradient(135deg, #0ba360 0%, #3cb0fd 100%); color: #fff; box-shadow: 0 10px 20px rgba(60,176,253,0.3);}
        .btn-submit:hover { transform: translateY(-3px); box-shadow: 0 15px 25px rgba(60,176,253,0.5);}
        .btn-reset { background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,255,255,0.2);}
        .btn-reset:hover { background: rgba(255,255,255,0.2); }
    </style>
</head>
<body>
    <div class="form-container">
        <div class="form-header">
            <h2>Voter Application</h2>
            <p>Initialize your node in the network</p>
        </div>
        <form action="submit.html" method="POST">
            <div class="form-group">
                <label>Legal Name</label>
                <input type="text" name="voter_name" placeholder="John Doe" required>
            </div>
            
            <div class="form-group">
                <label>Secure Identifier (Email)</label>
                <input type="email" name="voter_email" placeholder="node@rec.ac.in" required>
            </div>
            
            <div class="form-group">
                <label>Assigned Branch (REC)</label>
                <select name="branch" required>
                    <option value="" disabled selected>-- Select Sector --</option>
                    <option value="AI & DS">Artificial Intelligence & Data Science</option>
                    <option value="CSE">Computer Science</option>
                    <option value="IT">Information Technology</option>
                    <option value="ECE">Electronics</option>
                </select>
            </div>
            
            <div class="form-group">
                <label>Demographic (Gender)</label>
                <div class="radio-group">
                    <label class="radio-label"><input type="radio" name="gender" value="Male" required> Male</label>
                    <label class="radio-label"><input type="radio" name="gender" value="Female"> Female</label>
                    <label class="radio-label"><input type="radio" name="gender" value="Other"> Other</label>
                </div>
            </div>
            
            <div class="form-group">
                <label>Registered Base Address</label>
                <textarea name="address" placeholder="Enter physical coordinates..." required></textarea>
            </div>
            
            <div class="buttons">
                <button type="reset" class="btn-reset">Clear Form</button>
                <button type="submit" class="btn-submit">Submit Application</button>
            </div>
        </form>
    </div>
</body>
</html>
