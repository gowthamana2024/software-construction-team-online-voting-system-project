<!DOCTYPE html>
<html>
<head>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@600&display=swap');
        body { 
            margin: 0; padding: 0; 
            background: linear-gradient(90deg, #1e1e2f 0%, #2a2a40 100%);
            color: #fff; font-family: 'Outfit', sans-serif;
            display: flex; justify-content: space-between; align-items: center; 
            height: 100vh; padding: 0 30px; box-sizing: border-box;
            border-bottom: 2px solid #00f2fe;
        }
        h1 { margin: 0; font-size: 24px; text-transform: uppercase; letter-spacing: 1px; display: flex; align-items: center; gap: 15px;}
        .logo { width: 40px; height: 40px; border-radius: 50%; background: #00f2fe; display: flex; align-items: center; justify-content: center; color: #1e1e2f; font-weight: bold; font-size: 20px;}
        .user-widget { display: flex; align-items: center; gap: 10px; }
        .avatar { width: 35px; height: 35px; border-radius: 50%; background: url('https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=100') center/cover; }
    </style>
</head>
<body>
    <h1><div class="logo">V</div> REC Voting Portal <span style="color:#00f2fe; font-size: 16px;">| AI & DS</span></h1>
    <div class="user-widget">
        <div style="text-align: right; font-size: 14px;">
            <div style="color: #00f2fe;">Gowthaman</div>
            <div style="color: #aaa; font-size: 12px;">Admin Node</div>
        </div>
        <div class="avatar"></div>
    </div>
</body>
</html>
