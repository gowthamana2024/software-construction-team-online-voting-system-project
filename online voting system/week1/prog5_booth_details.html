<!DOCTYPE html>
<html>
<head>
    <title>Booth Details</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap');
        body { margin: 0; font-family: 'Outfit', sans-serif; background: #fff; height: 100vh; display: flex; align-items: center; justify-content: center; padding: 40px; box-sizing: border-box;}
        .card { width: 100%; max-width: 500px; border-radius: 20px; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,0.1); background: #fdfdfd; border: 1px solid #eee; transition: all 0.5s ease;}
        .card-header { position: relative; height: 200px; background-position: center; background-size: cover; background-color: #2c3e50; transition: background 0.5s ease;}
        .card-header::after { content: ''; position: absolute; top:0; left:0; width:100%; height:100%; background: linear-gradient(0deg, #fdfdfd 0%, rgba(253,253,253,0) 100%); }
        .tag { position: absolute; top: 20px; right: 20px; background: #2ecc71; color: white; padding: 8px 15px; border-radius: 20px; font-weight: 800; font-size: 12px; z-index: 2; box-shadow: 0 4px 10px rgba(46,204,113,0.3);}
        .tag.offline { background: #e74c3c; box-shadow: 0 4px 10px rgba(231,76,60,0.3); }
        .card-body { padding: 40px 30px; position: relative; z-index: 2; margin-top: -50px;}
        h2 { margin: 0 0 5px; color: #2c3e50; font-size: 32px;}
        .subtitle { color: #3498db; font-weight: 600; margin-bottom: 25px; font-size: 16px;}
        
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px;}
        .stat-box { background: #f4f6f9; padding: 15px; border-radius: 12px; border: 1px solid #e1e5eb;}
        .stat-label { color: #7f8c8d; font-size: 12px; text-transform: uppercase; font-weight: 600; margin-bottom: 5px;}
        .stat-val { color: #2c3e50; font-size: 16px; font-weight: 800;}
        
        .progress-container { margin-bottom: 10px;}
        .progress-label { display: flex; justify-content: space-between; font-weight: 600; color: #2c3e50; margin-bottom: 8px; font-size: 14px;}
        .progress-bar { width: 100%; height: 10px; background: #eee; border-radius: 5px; overflow: hidden;}
        .progress-fill { height: 100%; background: linear-gradient(90deg, #3498db, #2ecc71); width: 0%; border-radius: 5px; transition: width 1s ease-out;}
        
        .content-wrap { opacity: 0; animation: fadeIn 0.5s forwards; }
        @keyframes fadeIn { to { opacity: 1; } }
    </style>
</head>
<body>
    <div class="card" id="card">
        <!-- Default safe placeholder for details -->
        <div class="card-header" id="c-header" style="background-image: url('https://placehold.co/800x400/2980b9/ffffff.png?text=Node+Standby');">
            <span class="tag" id="t-tag">● STANDBY</span>
        </div>
        <div class="card-body content-wrap">
            <h2 id="c-title">Connect Node</h2>
            <div class="subtitle" id="c-subtitle">Awaiting map selection...</div>
            
            <div class="stat-grid">
                <div class="stat-box">
                    <div class="stat-label">Operating Hours</div>
                    <div class="stat-val" id="c-hours">-- : --</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Security Level</div>
                    <div class="stat-val" id="c-sec">--</div>
                </div>
            </div>
            
            <div class="progress-container">
                <div class="progress-label"><span>Voter Turnout</span> <span id="c-turnout-pct">0%</span></div>
                <div class="progress-bar">
                    <div class="progress-fill" id="c-turnout-bar"></div>
                </div>
            </div>
            <p id="c-desc" style="color: #7f8c8d; font-size: 14px; line-height: 1.6; margin-top: 20px;">
                Please select a polling booth hotspot from the interactive map to load real-time telemetry and diagnostics for that location.
            </p>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const booth = urlParams.get('booth');

        const databases = {
            aids: {
                title: "AI & DS Sector",
                subtitle: "Primary Polling Node",
                hours: "08:00 - 17:00",
                sec: "Class A (Biometric)",
                turnout: "68%",
                bg: "https://images.pexels.com/photos/1519088/pexels-photo-1519088.jpeg?auto=compress&cs=tinysrgb&w=800",
                desc: "This terminal requires active student credentials for the AI & DS department. Ensure your encrypted ID matrix is loaded before initializing voting sequence.",
                tagText: "● ONLINE HIGH LOAD",
                online: true
            },
            cse: {
                title: "CSE Sector",
                subtitle: "Software Wing Node",
                hours: "08:30 - 16:30",
                sec: "Class B (Keycard)",
                turnout: "85%",
                bg: "https://placehold.co/800x400/2c3e50/ffffff.png?text=CSE+Network",
                desc: "Computer Science polling location. High network activity detected. Proceed with standard authentication module.",
                tagText: "● ONLINE STABLE",
                online: true
            },
            ece: {
                title: "ECE Sector",
                subtitle: "Hardware Labs Hub",
                hours: "09:00 - 16:00",
                sec: "Class B (Retinal)",
                turnout: "42%",
                bg: "https://placehold.co/800x400/16a085/ffffff.png?text=Hardware+Labs",
                desc: "Electronics and Communication Engineering terminal. Reduced turnout expected. Hardware diagnostics running.",
                tagText: "● ONLINE STABLE",
                online: true
            },
            admin: {
                title: "Admin Base",
                subtitle: "Central Executive Hub",
                hours: "OFFLINE",
                sec: "Class S (Clearance)",
                turnout: "100%",
                bg: "https://placehold.co/800x400/c0392b/ffffff.png?text=Admin+Lockdown",
                desc: "Centralized executive node. Voting closed or restricted to faculty clearance. Access denied for student nodes.",
                tagText: "● OFFLINE RESTRICTED",
                online: false
            }
        };

        if(booth && databases[booth]) {
            const data = databases[booth];
            document.getElementById('c-title').innerText = data.title;
            document.getElementById('c-subtitle').innerText = data.subtitle;
            document.getElementById('c-hours').innerText = data.hours;
            document.getElementById('c-sec').innerText = data.sec;
            document.getElementById('c-turnout-pct').innerText = data.turnout;
            
            // Timeout used to trigger the CSS transition
            setTimeout(() => {
                document.getElementById('c-turnout-bar').style.width = data.turnout;
            }, 100);
            
            document.getElementById('c-header').style.backgroundImage = `url('${data.bg}')`;
            document.getElementById('c-desc').innerText = data.desc;
            
            const tag = document.getElementById('t-tag');
            tag.innerText = data.tagText;
            if(!data.online) {
                tag.classList.add('offline');
                document.getElementById('c-turnout-bar').style.background = 'linear-gradient(90deg, #e74c3c, #c0392b)';
            }
        }
    </script>
</body>
</html>
