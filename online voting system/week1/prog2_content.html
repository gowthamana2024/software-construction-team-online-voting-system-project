<!DOCTYPE html>
<html>
<head>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;600;800&display=swap');
        body { 
            margin: 0; padding: 40px; 
            background: #2a2a40; background-image: radial-gradient(circle at 100% 100%, #1e1e2f 0%, #2a2a40 100%);
            color: #fff; font-family: 'Outfit', sans-serif;
            height: 100vh; box-sizing: border-box;
            background-repeat: no-repeat;
        }
        .hero { background: url('https://images.unsplash.com/photo-1451187580459-43490279c0fa?auto=format&fit=crop&w=1200') center/cover; padding: 60px; border-radius: 20px; position: relative; overflow: hidden; box-shadow: 0 20px 40px rgba(0,0,0,0.4);border: 1px solid rgba(255,255,255,0.1); }
        .hero::before { content: ''; position: absolute; top:0; left:0; width:100%; height:100%; background: linear-gradient(90deg, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0.2) 100%); z-index: 1;}
        .hero-content { position: relative; z-index: 2; max-width: 600px;}
        h2 { font-size: 42px; margin: 0 0 20px; font-weight: 800; color: #00f2fe; }
        p { font-size: 18px; color: #ddd; line-height: 1.6; margin-bottom: 30px;}
        .btn-glow { display: inline-block; padding: 15px 30px; background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%); color: #1e1e2f; text-decoration: none; font-weight: 800; border-radius: 30px; text-transform: uppercase; box-shadow: 0 10px 20px rgba(0,242,254,0.4); transition: transform 0.3s; }
        .btn-glow:hover { transform: scale(1.05); }
    </style>
</head>
<body>
    <div class="hero">
        <div class="hero-content">
            <h2>Welcome to Next-Gen Democracy</h2>
            <p>The REC Online Voting Portal ensures 100% cryptographic transparency. Securely cast your vote for the AI & DS department representation using our advanced ledger technology.</p>
            <a href="prog2_login.html" class="btn-glow">Access Terminal</a>
        </div>
    </div>
</body>
</html>
