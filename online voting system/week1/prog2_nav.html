<!DOCTYPE html>
<html>
<head>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600&display=swap');
        body { 
            margin: 0; padding: 0; 
            background: #1e1e2f; 
            color: #ccc; font-family: 'Outfit', sans-serif;
            height: 100vh;  box-sizing: border-box;
            border-right: 1px solid rgba(255,255,255,0.05);

            border-left: 4px solid transparent;

        .icon { width: 24px; height: 24px; margin-right: 15px; background: rgba(255,255,255,0.1); border-radius: 5px; display: inline-block;}
        .countdown { padding: 20px; margin: 20px; background: rgba(0,0,0,0.3); border-radius: 10px; text-align: center; border: 1px solid rgba(0,242,254,0.3); }
        .countdown h4 { margin: 0 0 10px; color: #00f2fe; font-size: 14px; text-transform: uppercase;}
        .timer { font-size: 24px; font-weight: bold; color: #fff; text-shadow: 0 0 10px #00f2fe; }
